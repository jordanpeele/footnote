# CI: the full node --test suite on every push to main and every PR.
# Zero-dependency project — no install step; npm test runs node's built-in runner.
name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]   # engines: >=22 (node --test glob args need 21+; Node 20 is EOL)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
