# CI: the full node --test suite on every push to main and every PR.
# Zero-dependency project — no install step; npm test runs node's built-in runner.
name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One version failing shouldn't cancel (and mask) the others.
      fail-fast: false
      matrix:
        # Node 20 is deliberately excluded: engines is >=22, and the test script
        # passes a quoted glob to node --test ("test/**/*.test.js"), which node
        # only expands itself from 21+ — on 20 it's treated as a literal path and
        # zero tests run. Node 20 is also past EOL (April 2026).
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
