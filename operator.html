<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0d11">
<title>Footnote — operator</title>
<link rel="stylesheet" href="/operator.css">
</head>
<body>
<!-- Second-phone operator surface (P3-J, solo street mode): big-thumb AIR/HOLD/SKIP on the
     unaired queue + PULL on the current on-air card. Driven entirely by operator.js against
     the capability URL (?room=&key=). ALL pipeline-derived strings render via textContent —
     live speech is adversarial input. -->
<header class="hd">
  <span class="brand">footnote<span class="sup">¹</span> <span class="brand-op">OP</span></span>
  <span class="room-chip" id="roomChip">—</span>
  <span class="conn-dot" id="connDot" title="connection"></span>
</header>
<div class="banner" id="banner" hidden></div>
<section class="onair-strip" id="onairStrip" hidden>
  <div class="oa-body">
    <div class="oa-row"><span class="oa-tag">● ON AIR</span><span class="oa-verdict" id="oaVerdict"></span></div>
    <div class="oa-claim" id="oaClaim"></div>
  </div>
  <button class="btn-pull" id="pullBtn" type="button">PULL</button>
</section>
<main class="queue" id="queue">
  <div class="empty" id="empty">waiting for checks — start the stream at home base…</div>
</main>
<script src="/operator.js"></script>
</body>
</html>
