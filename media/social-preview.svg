<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Footnote — real-time fact-checking for live streams">
  <!-- Source for media/social-preview.png (GitHub social card, 1280x640).
       Banner identity condensed: kicker, wordmark, tagline, verdict accent band. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12151c"/>
      <stop offset="1" stop-color="#0b0d11"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- kicker chip -->
  <rect x="92" y="150" width="230" height="42" rx="6" fill="none" stroke="#00d68f" stroke-opacity="0.45" stroke-width="2"/>
  <text x="207" y="178" text-anchor="middle" font-family="'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="800" letter-spacing="4" fill="#00d68f">FACT CHECK</text>

  <!-- wordmark -->
  <text x="84" y="368" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="152" font-weight="900" letter-spacing="-3" fill="#ffffff">FOOTNOTE</text>
  <text x="916" y="292" font-family="Georgia,'Times New Roman',serif" font-size="94" font-weight="800" fill="#00d68f">¹</text>

  <!-- tagline -->
  <text x="90" y="438" font-family="'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="29" font-weight="600" letter-spacing="0.5" fill="#9aa3af">Real-time fact-checking for live streams</text>

  <!-- repo line -->
  <text x="90" y="536" font-family="'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="600" fill="#5c6470">github.com/jordanpeele/footnote</text>

  <!-- five-verdict accent band -->
  <rect x="0"    y="620" width="256" height="20" fill="#0b8f5f"/>
  <rect x="256"  y="620" width="256" height="20" fill="#d33143"/>
  <rect x="512"  y="620" width="256" height="20" fill="#d79321"/>
  <rect x="768"  y="620" width="256" height="20" fill="#7161d8"/>
  <rect x="1024" y="620" width="256" height="20" fill="#4a5160"/>
</svg>
