<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Footnote — real-time fact-checking for live streams">
  <!-- Variant A — "the lower-third": left-set wordmark over the on-air kicker chip,
       five-verdict accent band riding the bottom edge like the card's timer bar.
       Self-contained opaque broadcast-dark background; safe on both GitHub themes. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12151c"/>
      <stop offset="1" stop-color="#0b0d11"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1280" height="320" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>

    <!-- kicker chip (echoes .oa-kicker) -->
    <rect x="72" y="58" width="196" height="34" rx="5" fill="none" stroke="#00d68f" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="170" y="81" text-anchor="middle" font-family="'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="800" letter-spacing="3.5" fill="#00d68f">FACT CHECK</text>

    <!-- wordmark -->
    <text x="66" y="204" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="118" font-weight="900" letter-spacing="-2" fill="#ffffff">FOOTNOTE</text>
    <text x="716" y="146" font-family="Georgia,'Times New Roman',serif" font-size="72" font-weight="800" fill="#00d68f">¹</text>

    <!-- tagline -->
    <text x="70" y="258" font-family="'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="23" font-weight="600" letter-spacing="0.5" fill="#9aa3af">Real-time fact-checking for live streams</text>

    <!-- right rail: the verdict system, stacked (echoes the verdict block) -->
    <g font-family="'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" letter-spacing="1.5">
      <rect x="1042" y="56" width="172" height="34" rx="4" fill="#0b8f5f"/>
      <text x="1128" y="79" text-anchor="middle" fill="#ffffff">TRUE</text>
      <rect x="1042" y="98" width="172" height="34" rx="4" fill="#d33143"/>
      <text x="1128" y="121" text-anchor="middle" fill="#ffffff">FALSE</text>
      <rect x="1042" y="140" width="172" height="34" rx="4" fill="#d79321"/>
      <text x="1128" y="163" text-anchor="middle" fill="#0b0b0b">MISLEADING</text>
      <rect x="1042" y="182" width="172" height="34" rx="4" fill="#7161d8"/>
      <text x="1128" y="205" text-anchor="middle" fill="#ffffff">NEEDS CONTEXT</text>
      <rect x="1042" y="224" width="172" height="34" rx="4" fill="#4a5160"/>
      <text x="1128" y="247" text-anchor="middle" fill="#ffffff">UNVERIFIABLE</text>
    </g>

    <!-- five-verdict accent band (echoes .oa-timer) -->
    <rect x="0"    y="308" width="256" height="12" fill="#0b8f5f"/>
    <rect x="256"  y="308" width="256" height="12" fill="#d33143"/>
    <rect x="512"  y="308" width="256" height="12" fill="#d79321"/>
    <rect x="768"  y="308" width="256" height="12" fill="#7161d8"/>
    <rect x="1024" y="308" width="256" height="12" fill="#4a5160"/>
  </g>

  <rect x="0.75" y="0.75" width="1278.5" height="318.5" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
</svg>
