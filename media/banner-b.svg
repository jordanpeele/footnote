<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Footnote — real-time fact-checking for live streams">
  <!-- Variant B — "centered broadcast": symmetric title-card composition, wordmark on
       center, tagline beneath, the five verdict chips laid out as a system row.
       Self-contained opaque broadcast-dark background; safe on both GitHub themes. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12151c"/>
      <stop offset="1" stop-color="#0b0d11"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1280" height="320" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>

    <!-- kicker rule -->
    <line x1="380" y1="62" x2="490" y2="62" stroke="#2a3040" stroke-width="1.5"/>
    <text x="640" y="68" text-anchor="middle" font-family="'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="800" letter-spacing="4" fill="#00d68f">LIVE · FACT · CHECK</text>
    <line x1="790" y1="62" x2="900" y2="62" stroke="#2a3040" stroke-width="1.5"/>

    <!-- wordmark, centered -->
    <g text-anchor="middle">
      <text x="618" y="180" font-family="Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="112" font-weight="900" letter-spacing="-2" fill="#ffffff">FOOTNOTE</text>
      <text x="932" y="124" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="68" font-weight="800" fill="#00d68f">¹</text>
      <text x="640" y="228" font-family="'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="600" letter-spacing="0.5" fill="#9aa3af">Real-time fact-checking for live streams</text>
    </g>

    <!-- verdict chip row -->
    <g font-family="'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" letter-spacing="1.5" text-anchor="middle">
      <rect x="285" y="256" width="96" height="32" rx="4" fill="#0b8f5f"/>
      <text x="333" y="277" fill="#ffffff">TRUE</text>
      <rect x="393" y="256" width="104" height="32" rx="4" fill="#d33143"/>
      <text x="445" y="277" fill="#ffffff">FALSE</text>
      <rect x="509" y="256" width="150" height="32" rx="4" fill="#d79321"/>
      <text x="584" y="277" fill="#0b0b0b">MISLEADING</text>
      <rect x="671" y="256" width="182" height="32" rx="4" fill="#7161d8"/>
      <text x="762" y="277" fill="#ffffff">NEEDS CONTEXT</text>
      <rect x="865" y="256" width="164" height="32" rx="4" fill="#4a5160"/>
      <text x="947" y="277" fill="#ffffff">UNVERIFIABLE</text>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1278.5" height="318.5" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
</svg>
